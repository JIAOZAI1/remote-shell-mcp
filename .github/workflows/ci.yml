name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -timeout 5m ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -timeout 5m ./...
